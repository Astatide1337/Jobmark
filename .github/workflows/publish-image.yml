name: Publish Jobmark image

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/astatide1337/jobmark

jobs:
  resolve:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      branch: ${{ steps.source.outputs.branch }}
      publish: ${{ steps.source.outputs.publish }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Resolve source revision
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            source_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${{ github.event.workflow_run.id }}")"
            source_branch="$(jq -r '.head_branch // empty' <<<"$source_run")"
            source_sha="$(jq -r '.head_sha // empty' <<<"$source_run")"
          else
            source_branch="$GITHUB_REF_NAME"
            source_sha="$GITHUB_SHA"
          fi

          if [[ "$source_branch" != "main" && "$source_branch" != "preview" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "branch=$source_branch"
            echo "publish=true"
            echo "sha=$source_sha"
          } >> "$GITHUB_OUTPUT"

  container-security:
    name: Scan release image and generate SBOM
    needs: resolve
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for security gates
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: jobmark:security-${{ needs.resolve.outputs.sha }}
          cache-from: type=gha

      - name: Generate CycloneDX image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: jobmark:security-${{ needs.resolve.outputs.sha }}
          format: cyclonedx-json
          artifact-name: jobmark-${{ needs.resolve.outputs.sha }}.cdx.json
          upload-artifact: true
          upload-artifact-retention: 30
          upload-release-assets: false

      - name: Scan image for fixed high and critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: jobmark:security-${{ needs.resolve.outputs.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload image scan results
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

  publish:
    needs: [resolve, container-security]
    if: >-
      needs.resolve.outputs.publish == 'true' &&
      needs.container-security.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main,enable=${{ needs.resolve.outputs.branch == 'main' }}
            type=raw,value=preview,enable=${{ needs.resolve.outputs.branch == 'preview' }}
            type=raw,value=sha-${{ needs.resolve.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.resolve.outputs.sha }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record immutable image identity
        run: echo "Published ${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
